name: Validate repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md GOVERNANCE.md CONTRIBUTING.md SECURITY.md docs/privacy-model.md docs/research-agenda.md; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -q "mirror, not a judge" README.md || { echo "README missing IKAI governing principle"; exit 1; }
          grep -q "ONLY NAKEBUSEN TRANSACTS" README.md || { echo "README missing transaction boundary"; exit 1; }
          echo "Required documentation baseline is present."
